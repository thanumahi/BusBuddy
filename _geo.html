<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>pending</title></head>
<body>
<div id="out">PENDING</div>
<iframe id="a" src="index.html" style="width:1100px;height:760px;border:0"></iframe>
<script>
const results = [];
const outEl = document.getElementById('out');
function render() {
  outEl.innerHTML = results.map(r => '<div>' + (r.pass ? 'PASS' : 'FAIL') + ' ' + r.name +
    (r.extra ? ' :: ' + r.extra : '') + '</div>').join('');
}
function ok(n, c, e) { results.push({ name: n, pass: !!c, extra: e === undefined ? '' : String(e) }); render(); }

document.getElementById('a').addEventListener('load', () => {
  const w = document.getElementById('a').contentWindow;
  const d = document.getElementById('a').contentDocument;
  const errors = [];
  w.onerror = (m, f, l) => errors.push(m + ' @' + f + ':' + l);
  const oe = w.console.error;
  w.console.error = function () { errors.push('E:' + [].join.call(arguments, ' ')); oe.apply(w.console, arguments); };
  const A = () => w.eval('BusBuddyApp');

  const seen = { toast: 0, title: '', msg: '', callout: '', dists: [] };

  function sample() {
    const dist = d.getElementById('teleDistance').innerText;
    if (seen.dists[seen.dists.length - 1] !== dist) seen.dists.push(dist);
    if (d.getElementById('notificationToast').style.display === 'flex') {
      seen.toast++;
      seen.title = d.getElementById('toastTitle').innerText;
      seen.msg = d.getElementById('toastMessage').innerText;
    }
    if (d.getElementById('geofenceAlertCallout').style.display === 'flex') {
      seen.callout = d.getElementById('geofenceAlertMsg').innerText;
    }
  }

  setTimeout(() => {
    ok('booted', !!A());
    ok('initial distance', d.getElementById('teleDistance').innerText !== '-- km',
       d.getElementById('teleDistance').innerText);
    A().switchTab('driver');
    A().startDriverTrip();
    ok('trip started', d.getElementById('tripStatusText').innerText === 'Trip In Transit');
  }, 4000);

  // Sample every 500ms for the duration of the simulated trip
  const iv = setInterval(sample, 500);

  setTimeout(() => {
    clearInterval(iv);
    ok('bus closed distance on stop-2', seen.dists.length > 2,
       seen.dists.slice(0, 8).join(' -> ') + ' ... last=' + seen.dists[seen.dists.length - 1]);
    ok('geofence alert fired', seen.toast > 0, seen.toast + ' toast ticks: ' + seen.title + ' | ' + seen.msg);
    ok('geofence callout shown', seen.callout !== '', seen.callout);
    const lat = d.getElementById('driverLat').innerText;
    const lng = d.getElementById('driverLng').innerText;
    ok('bus travelled toward stop-2', lat !== '13.08270' || lng !== '80.27070', lat + ',' + lng);
    ok('no runtime errors', errors.length === 0, errors.join(' | '));
    A().endDriverTrip();
    render();
  }, 40000);
});
</script>
</body>
</html>
